
<style>
#erd svg { max-width: 100%; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  er: { layoutDirection: 'TB', minEntityWidth: 180, entityPadding: 12 },
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USUARIOS ||--o{ TABLA_CLIENTE : "manages (id_ejecutivo)"
  TABLA_CLIENTE ||--|| TABLA_CLIENTE_DETALLES : "has details"
  TABLA_CLIENTE ||--o{ TABLA_ARCHIVOS_CLIENTES : "document repository"
  TABLA_CLIENTE ||--o{ TABLA_PRODUCTO_CLIENTE : "contracts"
  TABLA_PRODUCTOS ||--o{ TABLA_PRODUCTO_CLIENTE : "defines"
  TABLA_PRODUCTO_CLIENTE ||--o{ CUENTAAHORRO_COTIZACION : "generates"
  TABLA_PRODUCTO_CLIENTE ||--o{ CUENTAAHORRO_CONTRATO : "formalizes"
  TABLA_CLIENTE ||--o{ CUENTAAHORRO_BENEFICIARIOS : "designates"
  TABLA_PRODUCTO_CLIENTE ||--o{ CUENTAAHORRO_BENEFICIARIOS : "linked to"
  CUENTAAHORRO_CONTRATO ||--o{ CONTRATO_FIRMAS_EVIDENCIA : "forensic evidence"
  CUENTAAHORRO_CONTRATO ||--o{ CUENTAAHORRO_ARCHIVOS_CONTRATO : "attachments"
  CUENTAAHORRO_CONTRATO ||--o{ CONTRATOS_BITACORA : "audit log"
  CUENTAAHORRO_CONTRATO ||--o{ CONTRATO_VERSIONES : "version history"

  USUARIOS {
    int id PK
    string nombre
    string usuario UK
    string email UK
    string password
    string rol "admin gerente ejecutivo"
    bool force_logout "kill switch"
    bool is_2fa_setup
    string google_auth_secret
    datetime last_2fa_login
  }

  TABLA_CLIENTE {
    int codigo_cliente PK
    string nombre
    string correo_electronico
    string telefono
    string contrasena
    string estatus_cliente
    date fecha_registro
    int id_ejecutivo FK
  }

  TABLA_CLIENTE_DETALLES {
    int id_clientedet PK
    int nacionalidad FK
    string curp
    string clave_id_mex
    string rfc
    string clabe_interbancaria
    string calle
    string codigo_postal
    string estado
    int codigo_cliente FK
  }

  TABLA_PRODUCTOS {
    int id_producto PK
    string nombre
    string clave_producto
    string descripcion
  }

  TABLA_PRODUCTO_CLIENTE {
    int id_producto_cliente PK
    string clave_producto_cliente
    int codigo_cliente FK
    int id_producto FK
    datetime fecha_creacion
  }

  CUENTAAHORRO_COTIZACION {
    int id_cotizacion PK
    date fecha_contrato
    int num_meses
    decimal monto_periodo
    decimal tasa_interes_anual
    decimal monto_recibir
    int estatus_solicitud FK
    int id_producto_cliente FK
  }

  CUENTAAHORRO_CONTRATO {
    int id_contrato PK
    int estatus_contrato FK
    enum estado_flujo "state machine"
    string token "client signing"
    string token_gerente "manager signing"
    string hash_documento_final
    string url_archivo_pdf
    string ruta_pdf_borrador
    string ruta_pdf_firmado_cliente
    int id_gerente_asignado
    int codigo_cliente FK
    int id_producto_cliente FK
  }

  CONTRATO_FIRMAS_EVIDENCIA {
    int id_evidencia PK
    int id_contrato FK
    enum rol_firmante "CLIENTE or GERENTE"
    string ip_origen
    text user_agent
    datetime fecha_firma_utc
    string hash_snapshot
    json metadatos_json "geolocation"
  }

  CUENTAAHORRO_BENEFICIARIOS {
    int id_beneficiario PK
    string nombre
    string curp
    decimal porcentaje
    int relacion_beneficiario FK
    int codigo_cliente FK
    int id_producto_cliente FK
  }

  CONTRATOS_BITACORA {
    int id_bitacora PK
    int id_contrato FK
    string accion
    text comentario
    string usuario
    datetime fecha
  }

  CONTRATO_VERSIONES {
    int id_version PK
    int id_contrato FK
    string ruta_pdf
    datetime fecha_archivado
    text comentarios
  }

  TABLA_ARCHIVOS_CLIENTES {
    int id_archivocliente PK
    string ruta_archivo
    string nombre_archivo
    int categoria_archivo FK
    int codigo_cliente FK
  }

  CUENTAAHORRO_ARCHIVOS_CONTRATO {
    int id_archivocontrato PK
    string ruta_archivo
    int categoria_archivo FK
    int id_producto_cliente FK
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
